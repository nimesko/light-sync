# Security checks: known-vulnerable dependencies (Rust and .NET) and committed secrets.
# Runs on every push and pull request, and weekly (new advisories appear for old code).
name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-advisories:
    name: Rust dependencies (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock
        run: cargo audit --deny warnings

  dotnet-vulnerable:
    name: .NET packages (NuGet advisories)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ui/LightSync.App
      - name: List vulnerable packages
        shell: pwsh
        run: |
          $out = dotnet list ui/LightSync.App package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $out
          if ($out -match 'has the following vulnerable packages') { throw 'Vulnerable NuGet packages found' }

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The whole history every time (the gitleaks action scans "first commit^..last", which fails
      # when the push includes the repository's first commit).
      - name: Scan every commit for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:latest git /repo --redact --verbose
