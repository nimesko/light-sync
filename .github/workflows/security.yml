# Security checks: known-vulnerable dependencies (Rust and .NET) and committed secrets.
# Runs on every push and pull request, and weekly (new advisories appear for old code).
name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-advisories:
    name: Rust dependencies (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock
        run: cargo audit --deny warnings

  dotnet-vulnerable:
    name: .NET packages (NuGet advisories)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore ui/LightSync.App
      - name: List vulnerable packages
        shell: pwsh
        run: |
          $out = dotnet list ui/LightSync.App package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $out
          if ($out -match 'has the following vulnerable packages') { throw 'Vulnerable NuGet packages found' }

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
